name: Build MiniCut Portable Folder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-portable.yml"
      - "patches/**"
      - "overrides/**"
      - "README.md"
      - "NOTICE.md"

permissions:
  contents: read

concurrency:
  group: minicut-portable-folder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 Portable Folder
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Ambil modifikasi MiniCut
        uses: actions/checkout@v4

      - name: Ambil basis OpenChatCut
        uses: actions/checkout@v4
        with:
          repository: 0xsline/OpenChatCut
          ref: 07437f60257a578745262359753bfccce337510c
          path: upstream

      - name: Siapkan Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Terapkan modifikasi MiniCut
        run: node patches/apply.mjs upstream

      - name: Validasi portable folder dan Bahasa Indonesia
        shell: pwsh
        run: |
          $builder = Get-Content upstream/config/electron-builder.config.mjs -Raw
          if ($builder -notmatch "productName: 'MiniCut'") { throw "Brand MiniCut belum diterapkan" }

          $pkg = Get-Content upstream/package.json -Raw | ConvertFrom-Json
          $script = $pkg.scripts.'desktop:dist:win'
          if ($script -notmatch '--dir') { throw "Build Windows belum memakai electron-builder --dir" }
          if ($script -match "'--win','portable'" -or $script -match '"--win","portable"') {
            throw "Build masih memakai single-file portable"
          }

          $locale = Get-Content upstream/src/i18n/locale.ts -Raw
          if ($locale -notmatch "ALL_LOCALES: readonly Locale\[\] = \['id'\]") { throw "UI belum dikunci ke Bahasa Indonesia" }
          if ($locale -notmatch "return 'id';") { throw "Locale aktif bukan Bahasa Indonesia" }

          $provider = Get-Content upstream/shared/llm-providers.ts -Raw
          if ($provider -notmatch "DEFAULT_LLM_PROVIDER: LlmProvider = 'gemini'") { throw "Gemini belum menjadi provider utama" }

      - name: Instal dependensi
        working-directory: upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Percobaan npm ci $attempt/3"
            npm ci
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Dependensi berhasil dipasang.'
              exit 0
            }

            Write-Warning "npm ci gagal pada percobaan $attempt. Menunggu lalu mencoba lagi..."
            if (Test-Path -LiteralPath 'node_modules') {
              cmd /c rmdir /s /q node_modules 2>$null
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
          }
          throw 'Instal dependensi gagal setelah 3 percobaan.'

      - name: Uji pool API Key Gemini MiniCut
        working-directory: upstream
        run: npx tsx shared/gemini-key-pool.verify.ts

      - name: Uji Agent hanya Gemini
        working-directory: upstream
        run: npx tsx src/agent/gemini-only.verify.ts

      - name: Uji pemahaman waktu Bahasa Indonesia
        working-directory: upstream
        run: npx tsx shared/indonesian-time.verify.ts

      - name: Uji routing perintah Agent Bahasa Indonesia
        working-directory: upstream
        run: npx tsx src/agent/tool-routing.minicut.verify.ts

      - name: Uji paritas Gemini dengan editor manual
        working-directory: upstream
        run: npx tsx src/agent/manual-editor-parity.verify.ts

      - name: Audit teks Agent dari tulisan Cina
        working-directory: upstream
        run: npx tsx src/agent/tool-runtime-cjk.verify.ts

      - name: Audit UI khusus Bahasa Indonesia
        working-directory: upstream
        run: npx tsx src/i18n/minicut-indonesian.verify.ts

      - name: Sinkronkan katalog tool Agent
        working-directory: upstream
        run: npm run generate:server-tool-catalog

      - name: Sinkronkan sumber shader
        working-directory: upstream
        run: node scripts/sync-shader-sources.mjs

      - name: Build MiniCut sebagai folder portable
        working-directory: upstream
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:dist:win

      - name: Susun folder portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'upstream/release/win-unpacked'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw "Folder hasil electron-builder tidak ditemukan: $source"
          }

          $root = 'upstream/release-package'
          $bundle = Join-Path $root 'MiniCut'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $bundle -Recurse -Force

          $exe = Join-Path $bundle 'MiniCut.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "MiniCut.exe tidak ditemukan di folder portable"
          }

          $data = Join-Path $bundle 'data'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          @'
          Folder ini dipakai MiniCut untuk data portable.
          Jangan hapus folder data jika ingin mempertahankan pengaturan dan proyek lokal.
          Untuk memindahkan MiniCut ke komputer/folder lain, salin seluruh folder MiniCut.
          '@ | Set-Content -LiteralPath (Join-Path $data 'BACA_SAYA.txt') -Encoding UTF8

          @'
          MINICUT PORTABLE FOLDER

          Cara menjalankan:
          1. Ekstrak ZIP sampai selesai.
          2. Buka folder MiniCut.
          3. Jalankan MiniCut.exe.
          4. Tidak perlu installer dan tidak perlu memindahkan file ke Program Files.

          Penting:
          - Jangan menjalankan MiniCut.exe langsung dari dalam ZIP.
          - Jangan memisahkan MiniCut.exe dari folder resources, locales, dan file pendukung lain.
          - Saat memindahkan aplikasi, pindahkan seluruh folder MiniCut.
          '@ | Set-Content -LiteralPath (Join-Path $bundle 'BACA_SAYA.txt') -Encoding UTF8

          Write-Host "Folder portable siap: $bundle"
          Get-ChildItem -LiteralPath $bundle | Select-Object Name, Length, Mode

      - name: Uji jalankan folder portable MiniCut
        shell: pwsh
        env:
          CC_SMOKE: "1"
          CC_SMOKE_RENDER: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path 'upstream/release-package/MiniCut').Path
          $portableExe = Join-Path $bundle 'MiniCut.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'minicut-smoke-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'minicut-smoke-stderr.log'

          Remove-Item -LiteralPath $stdout -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $stderr -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $portableExe -WorkingDirectory $bundle -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $null = $process.Handle
          $finished = $process.WaitForExit(420000)
          if (-not $finished) {
            taskkill /T /F /PID $process.Id 2>$null | Out-Null
          }

          Write-Host '--- MiniCut portable smoke stdout ---'
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
          Write-Host '--- MiniCut portable smoke stderr ---'
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }

          $smokeOk = (Test-Path -LiteralPath $stdout) -and `
            (Select-String -LiteralPath $stdout -Pattern 'SMOKE-OK' -Quiet)
          if (-not $smokeOk) {
            if (-not $finished) {
              throw 'MiniCut Portable masih berjalan setelah 420 detik dan tidak mencapai SMOKE-OK.'
            }
            throw "MiniCut Portable gagal smoke test dengan exit code $($process.ExitCode)"
          }

          foreach ($required in @('data', 'data/runtime', 'data/electron', 'resources')) {
            $path = Join-Path $bundle $required
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Struktur portable tidak lengkap: $required"
            }
          }

          Write-Host 'MiniCut Portable Folder berhasil dijalankan.'

      - name: Bersihkan data hasil smoke test
        shell: pwsh
        run: |
          $data = 'upstream/release-package/MiniCut/data'
          Remove-Item -LiteralPath $data -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          @'
          Folder data portable MiniCut.
          Pengaturan dan data runtime akan dibuat di sini saat aplikasi dijalankan.
          '@ | Set-Content -LiteralPath (Join-Path $data 'BACA_SAYA.txt') -Encoding UTF8

      - name: Tampilkan hasil portable folder
        shell: pwsh
        run: |
          $bundle = 'upstream/release-package/MiniCut'
          $files = @(Get-ChildItem -LiteralPath $bundle -Recurse -File)
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host "Jumlah file: $($files.Count)"
          Write-Host ("Ukuran folder: {0:N2} MB" -f ($bytes / 1MB))
          Get-ChildItem -LiteralPath $bundle | Select-Object Name, Length, Mode

      - name: Unggah MiniCut Portable Folder
        uses: actions/upload-artifact@v4
        with:
          name: MiniCut-Portable-Windows-x64
          path: |
            upstream/release-package/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Unggah source hasil modifikasi
        uses: actions/upload-artifact@v4
        with:
          name: MiniCut-Corresponding-Source
          path: |
            upstream/
            !upstream/node_modules/
            !upstream/release/
            !upstream/release-package/
            !upstream/desktop-dist/
            !upstream/dist/
          retention-days: 14
