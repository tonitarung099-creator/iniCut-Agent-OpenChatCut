name: Build MiniCut Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-portable.yml"
      - "patches/**"
      - "overrides/**"
      - "README.md"
      - "NOTICE.md"

permissions:
  contents: read

concurrency:
  group: minicut-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 Portable
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Ambil modifikasi MiniCut
        uses: actions/checkout@v4

      - name: Ambil basis OpenChatCut
        uses: actions/checkout@v4
        with:
          repository: 0xsline/OpenChatCut
          ref: 07437f60257a578745262359753bfccce337510c
          path: upstream

      - name: Siapkan Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Terapkan modifikasi MiniCut
        run: node patches/apply.mjs upstream

      - name: Validasi target portable dan Bahasa Indonesia
        shell: pwsh
        run: |
          $builder = Get-Content upstream/config/electron-builder.config.mjs -Raw
          if ($builder -notmatch "target: \['portable'\]") { throw "Target Windows belum portable" }
          if ($builder -notmatch "productName: 'MiniCut'") { throw "Brand MiniCut belum diterapkan" }

          $locale = Get-Content upstream/src/i18n/locale.ts -Raw
          if ($locale -notmatch "ALL_LOCALES: readonly Locale\[\] = \['id'\]") { throw "UI belum dikunci ke Bahasa Indonesia" }
          if ($locale -notmatch "return 'id';") { throw "Locale aktif bukan Bahasa Indonesia" }

          $provider = Get-Content upstream/shared/llm-providers.ts -Raw
          if ($provider -notmatch "DEFAULT_LLM_PROVIDER: LlmProvider = 'gemini'") { throw "Gemini belum menjadi provider utama" }

      - name: Instal dependensi
        working-directory: upstream
        run: npm ci

      - name: Uji pool API Key Gemini MiniCut
        working-directory: upstream
        run: npx tsx shared/gemini-key-pool.verify.ts

      - name: Uji pemahaman waktu Bahasa Indonesia
        working-directory: upstream
        run: npx tsx shared/indonesian-time.verify.ts

      - name: Uji routing perintah Agent Bahasa Indonesia
        working-directory: upstream
        run: npx tsx src/agent/tool-routing.minicut.verify.ts

      - name: Audit UI khusus Bahasa Indonesia
        working-directory: upstream
        run: npx tsx src/i18n/minicut-indonesian.verify.ts

      - name: Sinkronkan sumber shader
        working-directory: upstream
        run: node scripts/sync-shader-sources.mjs

      - name: Build MiniCut Portable
        working-directory: upstream
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:dist:win

      - name: Uji jalankan MiniCut Portable
        shell: pwsh
        env:
          CC_SMOKE: "1"
          CC_SMOKE_RENDER: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $built = @(Get-ChildItem -LiteralPath upstream/release -Filter 'MiniCut-Portable-*.exe' -File)
          if ($built.Count -ne 1) {
            throw "Harus ada tepat satu MiniCut Portable EXE, ditemukan $($built.Count)"
          }

          $portableDir = Join-Path $env:RUNNER_TEMP "minicut-portable-smoke-$PID"
          Remove-Item -LiteralPath $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          $portableExe = Join-Path $portableDir 'MiniCut.exe'
          Copy-Item -LiteralPath $built[0].FullName -Destination $portableExe

          $stdout = Join-Path $portableDir 'smoke-stdout.log'
          $stderr = Join-Path $portableDir 'smoke-stderr.log'
          $process = Start-Process -FilePath $portableExe -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $null = $process.Handle
          $finished = $process.WaitForExit(420000)
          if (-not $finished) {
            taskkill /T /F /PID $process.Id 2>$null | Out-Null
          }

          Write-Host '--- MiniCut portable smoke stdout ---'
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
          Write-Host '--- MiniCut portable smoke stderr ---'
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }

          $smokeOk = (Test-Path -LiteralPath $stdout) -and `
            (Select-String -LiteralPath $stdout -Pattern 'SMOKE-OK' -Quiet)
          if (-not $smokeOk) {
            if (-not $finished) {
              throw 'MiniCut Portable masih berjalan setelah 420 detik dan tidak mencapai SMOKE-OK.'
            }
            throw "MiniCut Portable gagal smoke test dengan exit code $($process.ExitCode)"
          }

          $portableData = Join-Path $portableDir 'data'
          if (-not (Test-Path -LiteralPath $portableData -PathType Container)) {
            throw "Folder data portable tidak dibuat di samping MiniCut.exe"
          }

          Write-Host "MiniCut Portable berhasil dijalankan dan memakai data lokal: $portableData"
      - name: Tampilkan hasil build
        shell: pwsh
        run: |
          Get-ChildItem upstream/release -Recurse | Select-Object FullName, Length

      - name: Unggah MiniCut Portable
        uses: actions/upload-artifact@v4
        with:
          name: MiniCut-Portable-Windows-x64
          path: |
            upstream/release/MiniCut-Portable-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Unggah source hasil modifikasi
        uses: actions/upload-artifact@v4
        with:
          name: MiniCut-Corresponding-Source
          path: |
            upstream/
            !upstream/node_modules/
            !upstream/release/
            !upstream/desktop-dist/
            !upstream/dist/
          retention-days: 14
